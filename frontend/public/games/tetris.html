<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,sans-serif;
  color:#e8e6e0;
  user-select:none;
  touch-action:none;
}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:10px;border:2px solid #1e3a3a}
#overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,3.5vw,24px);
  background:rgba(6,6,6,0.95);
  border-radius:10px;
  padding:1.5rem;
  text-align:center;
}
#ov-icon{font-size:clamp(48px,13vw,76px);line-height:1.1}
#ov-title{font-size:clamp(24px,7vw,40px);font-weight:800;color:#ffffff;letter-spacing:-0.5px;line-height:1}
#ov-desc{font-size:clamp(11px,2.8vw,14px);color:#e8e6e0;letter-spacing:0.1px}
#ov-controls{
  font-size:clamp(10px,2.4vw,13px);
  color:rgba(255,255,255,0.45);
  display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:center;
}
#ov-controls .row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;}
#ov-controls .k{
  display:inline-flex;align-items:center;justify-content:center;
  padding:2px 7px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.18);
  border-bottom:2px solid rgba(255,255,255,0.28);
  border-radius:4px;
  color:rgba(255,255,255,0.82);font-size:0.85em;line-height:1.4;
}
#ov-controls .sep{color:rgba(255,255,255,0.22);margin:0 2px;}
#overlay .final{font-size:clamp(36px,12vw,64px);font-weight:800;color:#00e7eb;line-height:1}
#overlay .result-msg{font-size:clamp(11px,2.8vw,14px);color:#9ca3af}
#btn{
  padding:clamp(10px,2.8vw,14px) clamp(32px,9vw,52px);
  border:2px solid #00e7eb;border-radius:8px;
  background:transparent;color:#00e7eb;
  font-size:clamp(14px,3.5vw,18px);font-weight:700;cursor:pointer;font-family:inherit;
  transition:background .18s,color .18s;
  letter-spacing:0.5px;
}
#btn:hover{background:#00e7eb;color:#000}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div id="ov-icon">🧱</div>
    <div id="ov-title">Tetris</div>
    <div id="ov-desc">Completa líneas · Encaja las piezas · Acumula combos</div>
    <button id="btn" onclick="start()">Jugar</button>
    <div id="ov-controls">
      <div class="row">
        <span class="k">←</span><span class="k">→</span> Mover
        <span class="sep">/</span>
        <span class="k">↑</span> Girar
        <span class="sep">/</span>
        <span class="k">↓</span> Bajar
      </div>
      <div class="row">
        <span class="k">Espacio</span> Caída rápida
        <span class="sep">/</span>
        Toca para girar · Desliza para mover
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const OL     = document.getElementById('overlay');

const COLS = 10, ROWS = 20;
let CELL = 24, boardX = 8, boardY = 20, infoX = 256;

const PIECES = [
  { s: [[1,1,1,1]],        c: '#00e7eb' }, // I
  { s: [[1,1],[1,1]],      c: '#FFD700' }, // O
  { s: [[0,1,0],[1,1,1]], c: '#9B59B6' }, // T
  { s: [[0,1,1],[1,1,0]], c: '#2ECC71' }, // S
  { s: [[1,1,0],[0,1,1]], c: '#E74C3C' }, // Z
  { s: [[1,0,0],[1,1,1]], c: '#E67E22' }, // L
  { s: [[0,0,1],[1,1,1]], c: '#3498DB' }, // J
];

let board, piece, nextPiece, score, best, level, lines, combo, running;
let raf, lastTime, dropTimer, dropInterval;
let flashTime = 0;
let floatTexts = [];

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight) - 4;
  canvas.width = canvas.height = s;
  // Board takes ~93% of height → bigger board
  CELL    = Math.floor(s * 0.935 / ROWS);
  boardX  = Math.floor(s * 0.016) + 1;
  boardY  = Math.floor((s - CELL * ROWS) / 2);
  infoX   = boardX + COLS * CELL + Math.floor(s * 0.022);
}
resize();
window.addEventListener('resize', () => { resize(); if (!running) bgDraw(); });

// ── Helpers ───────────────────────────────────────────────────────────────────
function randPiece() {
  const p = PIECES[Math.floor(Math.random() * PIECES.length)];
  return { s: p.s.map(r => [...r]), c: p.c,
           x: Math.floor(COLS / 2) - Math.floor(p.s[0].length / 2), y: -1 };
}
function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  const res = Array.from({ length: cols }, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      res[c][rows - 1 - r] = shape[r][c];
  return res;
}
function fits(s, x, y) {
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c]) {
        const nx = x + c, ny = y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
        if (ny >= 0 && board[ny][nx]) return false;
      }
  return true;
}
function ghostY() {
  let gy = piece.y;
  while (fits(piece.s, piece.x, gy + 1)) gy++;
  return gy;
}
function tryRotate() {
  const rot = rotate(piece.s);
  for (const k of [0, -1, 1, -2, 2])
    if (fits(rot, piece.x + k, piece.y)) { piece.s = rot; piece.x += k; return; }
}

// ── Float text ────────────────────────────────────────────────────────────────
function addFloat(text, color, small) {
  const cx = boardX + COLS * CELL / 2;
  const base = boardY + ROWS * CELL * 0.42;
  floatTexts.push({ text, color: color || '#fff', x: cx,
    y: base - floatTexts.length * Math.round(CELL * 1.1),
    alpha: 1, vel: -0.7, small: !!small });
  if (floatTexts.length > 6) floatTexts.shift();
}
function tickFloats() {
  floatTexts = floatTexts.filter(f => f.alpha > 0.02);
  floatTexts.forEach(f => { f.y += f.vel; f.alpha -= 0.016; });
}
function drawFloats() {
  ctx.save();
  ctx.textAlign = 'center';
  floatTexts.forEach(f => {
    const fs2 = f.small
      ? Math.max(9, Math.round(CELL * 0.52))
      : Math.max(11, Math.round(CELL * 0.68));
    ctx.globalAlpha = f.alpha;
    ctx.font = `800 ${fs2}px system-ui`;
    // Shadow for readability
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ── Game logic ────────────────────────────────────────────────────────────────
function calcContacts() {
  let contacts = 0;
  for (let r = 0; r < piece.s.length; r++)
    for (let c = 0; c < piece.s[r].length; c++) {
      if (!piece.s[r][c]) continue;
      const ax = piece.x + c, ay = piece.y + r;
      if (ay < 0) continue;
      if (ax === 0 || board[ay]?.[ax - 1])    contacts++; // izquierda
      if (ax === COLS-1 || board[ay]?.[ax+1]) contacts++; // derecha
      if (ay+1 >= ROWS || board[ay+1]?.[ax])  contacts++; // abajo
    }
  return contacts;
}

function lock() {
  // 1. Bonus de encaje ANTES de colocar la pieza
  const contacts  = calcContacts();
  const totalSides = piece.s.flat().filter(Boolean).length * 3;
  const ratio = contacts / totalSides;
  if (contacts >= 2) {
    const fitBonus = Math.round(contacts * (level + 1) * 2);
    score += fitBonus;
    const lv = ratio;
    const label = lv >= 0.85 ? '¡Perfecto!' : lv >= 0.6 ? '¡Buen encaje!' : 'Encaje';
    const col   = lv >= 0.85 ? '#FFD700' : lv >= 0.6 ? '#00e7eb' : 'rgba(255,255,255,0.6)';
    addFloat(label + ' +' + fitBonus, col, ratio < 0.6);
  }

  // 2. Colocar pieza
  for (let r = 0; r < piece.s.length; r++)
    for (let c = 0; c < piece.s[r].length; c++)
      if (piece.s[r][c] && piece.y + r >= 0)
        board[piece.y + r][piece.x + c] = piece.c;

  // 3. Completar filas
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(c => c)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }

  if (cleared > 0) {
    combo++;
    lines += cleared;
    const base     = [0, 100, 300, 500, 800][cleared] * (level + 1);
    const comboMult = combo > 1 ? 1 + (combo - 1) * 0.5 : 1;
    const lineScore = Math.round(base * comboMult);
    score += lineScore;
    level  = Math.floor(lines / 10);
    dropInterval = Math.max(50, 700 - level * 60);
    flashTime = performance.now();

    // Texto flotante de filas
    const tag = ['', 'LÍNEA', 'DOBLE', 'TRIPLE', '¡TETRIS!'][cleared];
    const lineColor = cleared === 4 ? '#FFD700' : '#5DCAA5';
    addFloat(tag + (combo > 1 ? '  x' + combo : ''), lineColor);
    if (combo > 1) addFloat('+' + Math.round(base * (comboMult - 1)) + ' combo', '#FFD700', true);

    // Perfect clear — tablero vacío
    if (board.every(row => row.every(c => !c))) {
      const pc = 2000 * (level + 1);
      score += pc;
      addFloat('⭐ PERFECT CLEAR +' + pc, '#FFD700');
    }
  } else {
    combo = 0;
  }

  if (score > best) { best = score; try { localStorage.setItem('boh_tetris', best); } catch {} }
  try { window.parent.postMessage({ type: 'boh_score_live', score }, '*'); } catch {}

  piece     = nextPiece;
  nextPiece = randPiece();
  if (!fits(piece.s, piece.x, piece.y)) gameOver();
}

function hardDrop() {
  const dist = ghostY() - piece.y;
  piece.y += dist;
  score += dist * 2;
  lock();
}

function init() {
  board    = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  score    = level = lines = combo = 0;
  dropInterval = 700;
  flashTime = 0;
  floatTexts = [];
  piece     = randPiece();
  nextPiece = randPiece();
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function tick(ts) {
  if (!running) return;
  raf = requestAnimationFrame(tick);
  const dt = ts - lastTime;
  lastTime = ts;
  dropTimer = (dropTimer || 0) + Math.min(dt, 200);
  if (dropTimer >= dropInterval) {
    dropTimer = 0;
    if (fits(piece.s, piece.x, piece.y + 1)) piece.y++;
    else lock();
  }
  tickFloats();
  draw();
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBlock(px, py, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha ?? 1;
  const pad = 1, r = Math.max(2, Math.floor(CELL * 0.14));
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur  = 5;
  roundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, r);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  roundRect(px + pad, py + pad, CELL - pad * 2, Math.max(2, CELL * 0.18), r);
  ctx.fill();
  ctx.restore();
}

function drawBoard() {
  const bw = COLS * CELL, bh = ROWS * CELL;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(boardX, boardY, bw, bh, 4); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let c = 1; c < COLS; c++) {
    ctx.beginPath(); ctx.moveTo(boardX + c * CELL, boardY); ctx.lineTo(boardX + c * CELL, boardY + bh); ctx.stroke();
  }
  for (let r = 1; r < ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(boardX, boardY + r * CELL); ctx.lineTo(boardX + bw, boardY + r * CELL); ctx.stroke();
  }

  // Celdas colocadas
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) drawBlock(boardX + c * CELL, boardY + r * CELL, board[r][c]);

  // Ghost piece — más visible con fill + borde
  const gy = ghostY();
  if (gy !== piece.y) {
    const pad = 1, rr = Math.max(2, Math.floor(CELL * 0.14));
    for (let r = 0; r < piece.s.length; r++)
      for (let c = 0; c < piece.s[r].length; c++)
        if (piece.s[r][c]) {
          const px2 = boardX + (piece.x + c) * CELL;
          const py2 = boardY + (gy + r) * CELL;
          // Fill semitransparente
          ctx.save();
          ctx.globalAlpha = 0.32;
          ctx.fillStyle = piece.c;
          roundRect(px2 + pad, py2 + pad, CELL - pad * 2, CELL - pad * 2, rr);
          ctx.fill();
          // Borde brillante
          ctx.globalAlpha = 0.7;
          ctx.strokeStyle = piece.c;
          ctx.lineWidth = 1.5;
          roundRect(px2 + pad, py2 + pad, CELL - pad * 2, CELL - pad * 2, rr);
          ctx.stroke();
          ctx.restore();
        }
  }

  // Pieza activa
  for (let r = 0; r < piece.s.length; r++)
    for (let c = 0; c < piece.s[r].length; c++)
      if (piece.s[r][c] && piece.y + r >= 0)
        drawBlock(boardX + (piece.x + c) * CELL, boardY + (piece.y + r) * CELL, piece.c);

  // Flash al completar filas
  if (flashTime) {
    const elapsed = performance.now() - flashTime;
    if (elapsed < 220) {
      ctx.save();
      ctx.fillStyle = `rgba(0,231,235,${(1 - elapsed / 220) * 0.4})`;
      roundRect(boardX, boardY, bw, bh, 4); ctx.fill();
      ctx.restore();
    } else { flashTime = 0; }
  }

  ctx.strokeStyle = 'rgba(0,231,235,0.12)';
  ctx.lineWidth = 1;
  roundRect(boardX, boardY, bw, bh, 4); ctx.stroke();

  drawFloats();
}

function drawInfo() {
  const s  = canvas.width;
  const iw = s - infoX - Math.floor(s * 0.02);
  const fs = Math.max(8, Math.round(CELL * 0.44));
  const ix = infoX;
  let cy = boardY;

  ctx.save();
  ctx.textAlign = 'left';

  function label(txt) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = `500 ${fs}px system-ui`;
    ctx.fillText(txt, ix, cy);
    cy += Math.round(fs * 1.1);
  }
  function value(txt, color) {
    ctx.fillStyle = color || 'rgba(255,255,255,0.75)';
    ctx.font = `700 ${Math.round(fs * 1.55)}px system-ui`;
    ctx.fillText(txt, ix, cy);
    cy += Math.round(fs * 2.1);
  }
  function gap(n) { cy += Math.round(fs * (n || 0.8)); }

  label('PUNTOS');
  value(score, 'rgba(0,231,235,0.9)');
  gap();

  label('RÉCORD');
  value(best, score >= best && score > 0 ? 'rgba(255,200,0,0.9)' : 'rgba(255,255,255,0.28)');
  gap();

  label('NIVEL');
  value(level + 1, 'rgba(255,255,255,0.7)');

  // Barra progreso nivel
  const barH = Math.max(3, Math.round(fs * 0.32));
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  roundRect(ix, cy, iw, barH, 2); ctx.fill();
  const prog = (lines % 10) / 10;
  if (prog > 0) {
    ctx.fillStyle = 'rgba(0,231,235,0.5)';
    roundRect(ix, cy, Math.round(iw * prog), barH, 2); ctx.fill();
  }
  cy += barH + Math.round(fs * 0.9);

  label('LÍNEAS');
  value(lines, 'rgba(255,255,255,0.5)');

  // Combo
  if (combo > 1) {
    gap(-0.5);
    ctx.fillStyle = '#FFD700';
    ctx.font = `700 ${Math.round(fs * 1.1)}px system-ui`;
    ctx.fillText('🔥 x' + combo + ' combo', ix, cy);
    cy += Math.round(fs * 1.7);
  }
  gap();

  // Siguiente pieza
  label('SIGUIENTE');
  const ns = nextPiece.s, nw = ns[0].length, nh = ns.length;
  const pc = Math.min(Math.floor(iw / (nw + 0.8)), Math.round(CELL * 0.78));
  const previewX = ix + Math.round((iw - nw * pc) / 2);
  for (let r = 0; r < nh; r++)
    for (let c = 0; c < nw; c++)
      if (ns[r][c]) drawBlock(previewX + c * pc, cy + r * pc, nextPiece.c, 0.85);

  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawBoard();
  drawInfo();
}

function bgDraw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const bw = COLS * CELL, bh = ROWS * CELL;
  ctx.strokeStyle = 'rgba(0,231,235,0.08)';
  ctx.lineWidth = 1;
  roundRect(boardX, boardY, bw, bh, 4); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 0.5;
  for (let c = 1; c < COLS; c++) { ctx.beginPath(); ctx.moveTo(boardX + c*CELL, boardY); ctx.lineTo(boardX + c*CELL, boardY + bh); ctx.stroke(); }
  for (let r = 1; r < ROWS; r++) { ctx.beginPath(); ctx.moveTo(boardX, boardY + r*CELL); ctx.lineTo(boardX + bw, boardY + r*CELL); ctx.stroke(); }
}

function gameOver() {
  running = false;
  cancelAnimationFrame(raf);
  try { window.parent.postMessage({ type: 'boh_score', score, game: 'tetris' }, '*'); } catch(e) {}
  const isRecord = score > 0 && score >= best;
  OL.innerHTML = `
    <div style="font-size:clamp(40px,11vw,64px);line-height:1">${isRecord && score > 0 ? '🏆' : '💀'}</div>
    <div class="final">${score}</div>
    <div class="result-msg">${isRecord && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}</div>
    <button id="btn" onclick="start()">Reintentar</button>
    <div id="ov-controls">
      <div class="row"><span class="k">←</span><span class="k">→</span> Mover <span class="sep">/</span> <span class="k">↑</span> Girar <span class="sep">/</span> <span class="k">↓</span> Bajar</div>
      <div class="row"><span class="k">Espacio</span> Caída rápida <span class="sep">/</span> Toca · Desliza</div>
    </div>
  `;
  OL.style.display = 'flex';
}

function start() {
  OL.style.display = 'none';
  init();
  running   = true;
  lastTime  = 0;
  dropTimer = 0;
  raf = requestAnimationFrame(tick);
}

// ── Teclado ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!running) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
    return;
  }
  switch (e.key) {
    case 'ArrowLeft':  case 'a': e.preventDefault(); if (fits(piece.s, piece.x-1, piece.y)) piece.x--; break;
    case 'ArrowRight': case 'd': e.preventDefault(); if (fits(piece.s, piece.x+1, piece.y)) piece.x++; break;
    case 'ArrowDown':  case 's':
      e.preventDefault();
      if (fits(piece.s, piece.x, piece.y+1)) { piece.y++; score++; dropTimer = 0; }
      else lock();
      break;
    case 'ArrowUp': case 'w': case 'x': e.preventDefault(); tryRotate(); break;
    case ' ': e.preventDefault(); hardDrop(); break;
  }
  draw();
});

// ── Touch ─────────────────────────────────────────────────────────────────────
let ts = null, tsMoved = false, tsLastX = 0;
canvas.addEventListener('touchstart', e => {
  ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  tsLastX = ts.x; tsMoved = false;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!ts || !running) return;
  const cx = e.touches[0].clientX, cy2 = e.touches[0].clientY;
  const dx = cx - tsLastX, dy = cy2 - ts.y;
  if (Math.abs(dx) > CELL * 0.62) {
    if (dx > 0) { if (fits(piece.s, piece.x+1, piece.y)) piece.x++; }
    else         { if (fits(piece.s, piece.x-1, piece.y)) piece.x--; }
    tsLastX = cx; tsMoved = true; draw();
  }
  if (dy > CELL * 2.5 && !tsMoved) { hardDrop(); tsMoved = true; draw(); }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!ts) return;
  if (!running) { start(); ts = null; return; }
  const dx = e.changedTouches[0].clientX - ts.x;
  const dy = e.changedTouches[0].clientY - ts.y;
  ts = null;
  if (!tsMoved && Math.abs(dx) < 12 && Math.abs(dy) < 12) { tryRotate(); draw(); }
}, { passive: false });

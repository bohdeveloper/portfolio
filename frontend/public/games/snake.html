<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;
  font-family:system-ui,-apple-system,sans-serif;
  color:#e8e6e0;
  user-select:none;
  overflow:hidden;
  touch-action:none;
}
#top{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:100%;
  padding:0 2px 8px;
}
#score{font-size:22px;font-weight:700;color:#00e7eb;min-width:40px;text-align:center}
#label{font-size:9px;color:#444;letter-spacing:1.5px;text-transform:uppercase}
#best-wrap{font-size:11px;color:#333;text-align:right}
#best-wrap b{color:#555}
canvas{display:block;border-radius:10px;border:2px solid #1e3a3a}
#overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;
  background:rgba(8,8,8,0.93);
  border-radius:10px;
  padding:1.5rem;
  text-align:center;
}
#overlay h2{font-size:28px;line-height:1}
#overlay .tagline{font-size:11px;color:#444;letter-spacing:0.5px}
#overlay .final{font-size:48px;font-weight:800;color:#00e7eb;line-height:1}
#overlay .result-msg{font-size:12px;color:#555}
#btn{
  padding:10px 32px;
  border:1px solid #00e7eb;border-radius:8px;
  background:transparent;color:#00e7eb;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:background .18s,color .18s;
  letter-spacing:0.5px;
}
#btn:hover{background:#00e7eb;color:#000}
#hint{font-size:10px;color:#2a2a2a;margin-top:-4px}
</style>
</head>
<body>
<div id="top">
  <div style="text-align:center">
    <div id="label">Score</div>
    <div id="score">0</div>
  </div>
  <div id="best-wrap">Récord<br><b id="best-val">0</b></div>
</div>
<div style="position:relative">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2>🐍</h2>
    <div style="font-size:20px;font-weight:600;color:#e8e6e0">Snake</div>
    <div class="tagline">¡Los bordes matan! · Evita los bloques rojos</div>
    <button id="btn" onclick="start()">Jugar</button>
    <div id="hint">↑ ↓ ← → / WASD</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const OL     = document.getElementById('overlay');
const scoreEl= document.getElementById('score');
const bestEl = document.getElementById('best-val');

const CELL = 20;
let W, H, snake, dir, next, food, score, best, running, raf, lastTick, speed, obstacles;

function resize() {
  const s = Math.min(window.innerWidth - 8, window.innerHeight - 70);
  const size = Math.floor(s / CELL) * CELL;
  canvas.width = canvas.height = size;
  W = canvas.width / CELL;
  H = canvas.height / CELL;
}
resize();
window.addEventListener('resize', () => { resize(); if (!running) bgDraw(); });

function rnd(n) { return Math.floor(Math.random() * n); }

function placeFood() {
  const occupied = new Set([
    ...snake.map(s => s.x + ',' + s.y),
    ...(obstacles || []).map(o => o.x + ',' + o.y),
  ]);
  let x, y, tries = 0;
  do { x = rnd(W); y = rnd(H); tries++; } while (occupied.has(x + ',' + y) && tries < 200);
  food = { x, y };
}

function addObstacle() {
  const occupied = new Set([
    ...snake.map(s => s.x + ',' + s.y),
    food.x + ',' + food.y,
    ...obstacles.map(o => o.x + ',' + o.y),
  ]);
  let x, y, tries = 0;
  do { x = rnd(W); y = rnd(H); tries++; } while ((occupied.has(x + ',' + y) || x < 1 || x >= W-1 || y < 1 || y >= H-1) && tries < 200);
  if (tries < 200) obstacles.push({ x, y });
}

function init() {
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2);
  snake = [{ x: cx, y: cy }, { x: cx-1, y: cy }, { x: cx-2, y: cy }];
  dir  = { x: 1, y: 0 };
  next = { x: 1, y: 0 };
  score = 0;
  obstacles = [];
  speed = 130;
  scoreEl.textContent = '0';
  placeFood();
}

function tick(ts) {
  if (!running) return;
  raf = requestAnimationFrame(tick);
  if (ts - lastTick < speed) return;
  lastTick = ts;

  dir = { ...next };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Borde = muerte
  if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H) { gameOver(); return; }
  // Obstáculo = muerte
  if (obstacles.some(o => o.x === head.x && o.y === head.y)) { gameOver(); return; }
  // Autocolisión
  if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('boh_snake', best); } catch {}
    }
    // Velocidad más agresiva: empieza en 130ms, -10ms cada 2 puntos, mín 50ms
    speed = Math.max(50, 130 - Math.floor(score / 2) * 10);
    // Nuevo obstáculo cada 5 puntos
    if (score % 5 === 0) addObstacle();
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  const cw = canvas.width, ch = canvas.height;
  // Background
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, cw, ch);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ch); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(cw,y*CELL); ctx.stroke(); }

  // Borde de peligro (muros mortales)
  const t2 = performance.now() / 800;
  const wallAlpha = 0.18 + 0.08 * Math.sin(t2);
  ctx.strokeStyle = `rgba(255,40,40,${wallAlpha})`;
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, cw - 3, ch - 3);

  // Obstáculos — bloques rojos con brillo
  obstacles.forEach(o => {
    ctx.save();
    ctx.shadowColor = 'rgba(255,50,50,0.7)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(200,30,30,0.85)';
    roundRect(o.x * CELL + 2, o.y * CELL + 2, CELL - 4, CELL - 4, 3);
    ctx.fill();
    ctx.restore();
    // Cruz interior
    ctx.strokeStyle = 'rgba(255,100,100,0.5)';
    ctx.lineWidth = 1;
    const cx2 = o.x * CELL + CELL / 2, cy2 = o.y * CELL + CELL / 2;
    ctx.beginPath(); ctx.moveTo(cx2-4, cy2-4); ctx.lineTo(cx2+4, cy2+4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx2+4, cy2-4); ctx.lineTo(cx2-4, cy2+4); ctx.stroke();
  });

  // Food — glowing dot
  const t = performance.now() / 600;
  const pulse = 0.65 + 0.35 * Math.sin(t);
  ctx.save();
  ctx.shadowColor = 'rgba(255,80,100,0.6)';
  ctx.shadowBlur  = 10 * pulse;
  ctx.fillStyle   = `rgba(255,70,95,${0.75 + 0.25 * pulse})`;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Snake body
  const len = snake.length;
  snake.forEach((s, i) => {
    const frac = 1 - i / len;
    const alpha = 0.35 + 0.65 * frac;
    const r = Math.round(0 * (1 - frac));
    const g = Math.round(180 * frac + 80);
    const b = Math.round(220 * frac + 30);

    if (i === 0) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,231,235,0.45)';
      ctx.shadowBlur  = 8;
      ctx.fillStyle   = '#00e7eb';
    } else {
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    }
    const pad = i === 0 ? 1 : 2;
    const radius = i === 0 ? 5 : 3;
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad*2, CELL - pad*2, radius);
    ctx.fill();
    if (i === 0) ctx.restore();
  });

  // Eyes on head
  const h = snake[0];
  ctx.fillStyle = '#0a0a0a';
  const ex1 = dir.x === 1 ? 13 : dir.x === -1 ? 5 : dir.y === 1 ? 7  : 7;
  const ey1 = dir.y === 1 ? 13 : dir.y === -1 ? 5 : dir.x === 1 ? 7  : 13;
  const ex2 = dir.x === 1 ? 13 : dir.x === -1 ? 5 : dir.y === 1 ? 13 : 13;
  const ey2 = dir.y === 1 ? 7  : dir.y === -1 ? 13: dir.x === 1 ? 13 : 7;
  ctx.beginPath(); ctx.arc(h.x*CELL+ex1, h.y*CELL+ey1, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(h.x*CELL+ex2, h.y*CELL+ey2, 2.2, 0, Math.PI*2); ctx.fill();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function bgDraw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,40,40,0.18)';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, canvas.width - 3, canvas.height - 3);
}

function gameOver() {
  running = false;
  cancelAnimationFrame(raf);
  // Notificar al portfolio la puntuación final
  try { window.parent.postMessage({ type: 'boh_score', score, game: 'snake' }, '*'); } catch(e) {}
  const isRecord = score > 0 && score >= best;
  OL.innerHTML = `
    <div style="font-size:32px">${isRecord && score > 0 ? '🏆' : '💀'}</div>
    <div class="final">${score}</div>
    <div class="result-msg">${isRecord && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}</div>
    <button id="btn" onclick="start()">Reintentar</button>
    <div id="hint">↑ ↓ ← → / WASD</div>
  `;
  OL.style.display = 'flex';
}

function start() {
  OL.style.display = 'none';
  init();
  running = true;
  lastTick = 0;
  raf = requestAnimationFrame(tick);
}

// Keyboard
document.addEventListener('keydown', e => {
  const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
  if (!running) {
    if (e.key in map || e.key === ' ') { e.preventDefault(); start(); }
    return;
  }
  if (!(e.key in map)) return;
  e.preventDefault();
  const [nx, ny] = map[e.key];
  if (nx !== 0 && dir.x === 0) next = { x: nx, y: 0 };
  if (ny !== 0 && dir.y === 0) next = { x: 0, y: ny };
});

// Touch / swipe
let ts = null;
canvas.addEventListener('touchstart', e => { ts = { x: e.touches[0].clientX, y: e.touches[0].clientY }; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!ts) return;
  if (!running) { start(); ts = null; return; }
  const dx = e.changedTouches[0].clientX - ts.x;
  const dy = e.changedTouches[0].clientY - ts.y;
  ts = null;
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  e.preventDefault();
  if (Math.abs(dx) > Math.abs(dy)) { if (dir.x === 0) next = { x: dx > 0 ? 1 : -1, y: 0 }; }
  else                              { if (dir.y === 0) next = { x: 0, y: dy > 0 ? 1 : -1 }; }
}, { passive: false });

// Init
try { best = parseInt(localStorage.getItem('boh_snake') || '0') || 0; bestEl.textContent = best; } catch {}
bgDraw();
</script>
</body>
</html>

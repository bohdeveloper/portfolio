<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,-apple-system,sans-serif;
  color:#e8e6e0;
  user-select:none;
  touch-action:none;
}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:10px;border:2px solid #1e3a3a}
#overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,4vw,28px);
  background:rgba(6,6,6,0.95);
  border-radius:10px;
  padding:1.5rem;
  text-align:center;
}
#ov-icon{font-size:clamp(52px,14vw,80px);line-height:1.1;margin-bottom:0}
#ov-title{font-size:clamp(24px,7vw,40px);font-weight:800;color:#ffffff;letter-spacing:-0.5px;line-height:1}
#ov-desc{font-size:clamp(12px,3vw,15px);color:#e8e6e0;letter-spacing:0.1px}
#ov-controls{
  font-size:clamp(11px,2.6vw,14px);
  color:rgba(255,255,255,0.45);
  display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:center;
}
#ov-controls .row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;}
#ov-controls .k{
  display:inline-flex;align-items:center;justify-content:center;
  padding:2px 7px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.18);
  border-bottom:2px solid rgba(255,255,255,0.28);
  border-radius:4px;
  color:rgba(255,255,255,0.82);font-size:0.85em;line-height:1.4;
}
#ov-controls .k.gold{
  color:rgba(255,215,0,0.9);
  background:rgba(255,215,0,0.07);
  border-color:rgba(255,215,0,0.25);
  border-bottom-color:rgba(255,215,0,0.4);
}
#ov-controls .sep{color:rgba(255,255,255,0.22);margin:0 2px;}
#overlay .final{font-size:clamp(36px,12vw,64px);font-weight:800;color:#00e7eb;line-height:1}
#overlay .result-msg{font-size:clamp(11px,2.8vw,14px);color:#9ca3af}
#btn{
  padding:clamp(10px,2.8vw,14px) clamp(32px,9vw,52px);
  border:2px solid #00e7eb;border-radius:8px;
  background:transparent;color:#00e7eb;
  font-size:clamp(14px,3.5vw,18px);font-weight:700;cursor:pointer;font-family:inherit;
  transition:background .18s,color .18s;
  letter-spacing:0.5px;
}
#btn:hover{background:#00e7eb;color:#000}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div id="ov-icon">🐍</div>
    <div id="ov-title">Snake</div>
    <div id="ov-desc">¡Los bordes matan! · Evita los bloques <span style="color:#ff6060;font-weight:600">rojos</span></div>
    <button id="btn" onclick="start()">Jugar</button>
    <div id="ov-controls">
      <div class="row">
        <span class="k">↑</span><span class="k">↓</span><span class="k">←</span><span class="k">→</span>
        <span class="sep">/</span><span class="k">WASD</span>
        <span class="sep">/</span>Deslizar
      </div>
      <div class="row" style="color:rgba(255,215,0,0.75)">
        <span class="k gold">Espacio</span>
        <span class="sep">/</span>
        <span>Mantener</span>
        <span style="margin-left:2px">⚡ Impulso</span>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const OL     = document.getElementById('overlay');

const CELL = 20;
const FOOD_COLORS = [
  { r:   0, g: 231, b: 235, sr:   0, sg: 200, sb: 220 }, // cyan
  { r: 255, g: 220, b:   0, sr: 255, sg: 190, sb:   0 }, // amarillo
  { r: 160, g:  80, b: 255, sr: 130, sg:  50, sb: 220 }, // morado
  { r:  50, g: 220, b: 100, sr:  30, sg: 190, sb:  80 }, // verde
  { r: 240, g: 240, b: 240, sr: 200, sg: 200, sb: 200 }, // blanco
  { r: 255, g: 100, b: 200, sr: 220, sg:  70, sb: 170 }, // rosa
];
let W, H, snake, dir, next, food, foodColor, score, best, running, raf, lastTick, speed, obstacles, obstacleCallCount;
let energy = 0, maxEnergy = 100, boosting = false, boostKey = false, touchBoost = false, touchBoostTimer = null;

function resize() {
  const s = Math.min(window.innerWidth, window.innerHeight) - 4;
  const size = Math.floor(s / CELL) * CELL;
  canvas.width = canvas.height = size;
  W = canvas.width / CELL;
  H = canvas.height / CELL;
}
resize();
window.addEventListener('resize', () => { resize(); if (!running) bgDraw(); });

function rnd(n) { return Math.floor(Math.random() * n); }

function placeFood() {
  const occupied = new Set([
    ...snake.map(s => s.x + ',' + s.y),
    ...(obstacles || []).map(o => o.x + ',' + o.y),
  ]);
  let x, y, tries = 0;
  do { x = rnd(W); y = rnd(H); tries++; } while (occupied.has(x + ',' + y) && tries < 200);
  food = { x, y };
  foodColor = FOOD_COLORS[rnd(FOOD_COLORS.length)];
}

function addObstacle() {
  obstacleCallCount++;
  const groupSize = Math.min(7, obstacleCallCount);
  let placed = false, tries = 0;
  while (!placed && tries < 300) {
    tries++;
    const horiz = Math.random() > 0.5;
    const startX = rnd(W - 2) + 1;
    const startY = rnd(H - 2) + 1;
    const occupied = new Set([
      ...snake.map(s => s.x + ',' + s.y),
      food.x + ',' + food.y,
      ...obstacles.map(o => o.x + ',' + o.y),
    ]);
    const cells = [];
    let valid = true;
    for (let i = 0; i < groupSize; i++) {
      const cx = horiz ? startX + i : startX;
      const cy = horiz ? startY : startY + i;
      if (cx < 1 || cx >= W-1 || cy < 1 || cy >= H-1 || occupied.has(cx + ',' + cy)) {
        valid = false; break;
      }
      cells.push({ x: cx, y: cy });
    }
    if (valid && cells.length === groupSize) {
      obstacles.push(...cells);
      placed = true;
    }
  }
}

function init() {
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2);
  snake = [{ x: cx, y: cy }, { x: cx-1, y: cy }, { x: cx-2, y: cy }];
  dir  = { x: 1, y: 0 };
  next = { x: 1, y: 0 };
  score = 0;
  obstacles = [];
  obstacleCallCount = 0;
  speed = 200;
  energy = 0;
  boosting = false;
  placeFood();
}

function tick(ts) {
  if (!running) return;
  raf = requestAnimationFrame(tick);
  boosting = (boostKey || touchBoost) && energy > 0;
  const effectiveSpeed = boosting ? Math.max(20, Math.round(speed / 3)) : speed;
  if (ts - lastTick < effectiveSpeed) return;
  lastTick = ts;
  if (boosting) energy = Math.max(0, energy - 2);

  dir = { ...next };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H) { gameOver(); return; }
  if (obstacles.some(o => o.x === head.x && o.y === head.y))   { gameOver(); return; }
  if (snake.some(s => s.x === head.x && s.y === head.y))       { gameOver(); return; }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    try { window.parent.postMessage({ type: 'boh_score_live', score }, '*'); } catch {}
    if (score > best) {
      best = score;
      try { localStorage.setItem('boh_snake', best); } catch {}
    }
    speed = Math.max(55, 200 - (snake.length - 3) * 7);
    energy = Math.min(maxEnergy, energy + 25);
    if (score % 5 === 0) addObstacle();
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function drawHUD() {
  const cw = canvas.width;
  const fs = Math.max(11, Math.round(canvas.width / 30));
  ctx.save();

  // Score — esquina superior izquierda
  ctx.textAlign = 'left';
  ctx.font = `700 ${fs * 1.6}px system-ui`;
  ctx.fillStyle = 'rgba(0,231,235,0.85)';
  ctx.fillText(score, 12, fs * 1.8);
  ctx.font = `400 ${fs * 0.75}px system-ui`;
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillText('SCORE', 12, fs * 2.7);

  // Récord — esquina superior derecha
  ctx.textAlign = 'right';
  ctx.font = `700 ${fs * 1.6}px system-ui`;
  ctx.fillStyle = score >= best && score > 0 ? 'rgba(255,200,0,0.85)' : 'rgba(255,255,255,0.3)';
  ctx.fillText(best, cw - 12, fs * 1.8);
  ctx.font = `400 ${fs * 0.75}px system-ui`;
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillText('RÉCORD', cw - 12, fs * 2.7);

  // Energía — centro superior (si hay energía)
  if (energy > 0 || boosting) {
    ctx.textAlign = 'center';
    ctx.font = `700 ${fs * 0.78}px system-ui`;
    ctx.fillStyle = boosting ? 'rgba(255,247,150,0.95)' : 'rgba(255,215,0,0.42)';
    ctx.fillText(boosting ? '⚡ IMPULSO' : '⚡ ' + Math.round((energy / maxEnergy) * 100) + '%', cw / 2, fs * 1.8);
  }

  ctx.restore();
}

function drawEnergyBar() {
  if (energy === 0 && !boosting) return;
  const bh = 5;
  const by = canvas.height - bh;
  const frac = energy / maxEnergy;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, by, canvas.width, bh);
  if (frac > 0) {
    ctx.save();
    if (boosting) {
      const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 80);
      ctx.shadowColor = 'rgba(255,215,0,0.9)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = `rgba(255,247,150,${pulse})`;
    } else {
      const gr = ctx.createLinearGradient(0, 0, canvas.width * frac, 0);
      gr.addColorStop(0, 'rgba(120,85,10,0.9)');
      gr.addColorStop(1, 'rgba(255,215,0,0.9)');
      ctx.fillStyle = gr;
    }
    ctx.fillRect(0, by, Math.round(canvas.width * frac), bh);
    ctx.restore();
  }
}

function draw() {
  const cw = canvas.width, ch = canvas.height;
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, cw, ch);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ch); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(cw,y*CELL); ctx.stroke(); }

  // Borde de peligro
  const t2 = performance.now() / 800;
  const wallAlpha = 0.18 + 0.08 * Math.sin(t2);
  ctx.strokeStyle = `rgba(255,40,40,${wallAlpha})`;
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, cw - 3, ch - 3);

  // Obstáculos
  obstacles.forEach(o => {
    ctx.save();
    ctx.shadowColor = 'rgba(255,50,50,0.7)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(200,30,30,0.85)';
    roundRect(o.x * CELL + 2, o.y * CELL + 2, CELL - 4, CELL - 4, 3);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,100,100,0.5)';
    ctx.lineWidth = 1;
    const cx2 = o.x * CELL + CELL / 2, cy2 = o.y * CELL + CELL / 2;
    ctx.beginPath(); ctx.moveTo(cx2-4, cy2-4); ctx.lineTo(cx2+4, cy2+4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx2+4, cy2-4); ctx.lineTo(cx2-4, cy2+4); ctx.stroke();
  });

  // Comida
  const t = performance.now() / 600;
  const pulse = 0.65 + 0.35 * Math.sin(t);
  const { r: fr, g: fg, b: fb, sr, sg, sb } = foodColor;
  ctx.save();
  ctx.shadowColor = `rgba(${sr},${sg},${sb},0.6)`;
  ctx.shadowBlur  = 10 * pulse;
  ctx.fillStyle   = `rgba(${fr},${fg},${fb},${0.75 + 0.25 * pulse})`;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Serpiente
  const len = snake.length;
  snake.forEach((s, i) => {
    const frac = 1 - i / len;
    const alpha = 0.35 + 0.65 * frac;
    const g = Math.round(180 * frac + 80);
    const b = Math.round(220 * frac + 30);
    if (i === 0) {
      ctx.save();
      ctx.shadowColor = boosting ? 'rgba(255,215,0,0.7)' : 'rgba(0,231,235,0.45)';
      ctx.shadowBlur  = boosting ? 14 : 8;
      ctx.fillStyle   = boosting ? '#FFD700' : '#00e7eb';
    } else {
      ctx.fillStyle = `rgba(0,${g},${b},${alpha})`;
    }
    const pad = i === 0 ? 1 : 2;
    const radius = i === 0 ? 5 : 3;
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad*2, CELL - pad*2, radius);
    ctx.fill();
    if (i === 0) ctx.restore();
  });

  // Ojos
  const h = snake[0];
  ctx.fillStyle = '#0a0a0a';
  const ex1 = dir.x === 1 ? 13 : dir.x === -1 ? 5 : dir.y === 1 ? 7  : 7;
  const ey1 = dir.y === 1 ? 13 : dir.y === -1 ? 5 : dir.x === 1 ? 7  : 13;
  const ex2 = dir.x === 1 ? 13 : dir.x === -1 ? 5 : dir.y === 1 ? 13 : 13;
  const ey2 = dir.y === 1 ? 7  : dir.y === -1 ? 13: dir.x === 1 ? 13 : 7;
  ctx.beginPath(); ctx.arc(h.x*CELL+ex1, h.y*CELL+ey1, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(h.x*CELL+ex2, h.y*CELL+ey2, 2.2, 0, Math.PI*2); ctx.fill();

  // HUD score/récord sobre el canvas
  drawHUD();
  drawEnergyBar();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function bgDraw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,canvas.height); ctx.stroke(); }
  for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width,y*CELL); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,40,40,0.18)';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, canvas.width - 3, canvas.height - 3);
}

function gameOver() {
  running = false;
  boosting = false; boostKey = false; touchBoost = false;
  if (touchBoostTimer) { clearTimeout(touchBoostTimer); touchBoostTimer = null; }
  cancelAnimationFrame(raf);
  try { window.parent.postMessage({ type: 'boh_score', score, game: 'snake' }, '*'); } catch(e) {}
  const isRecord = score > 0 && score >= best;
  OL.innerHTML = `
    <div style="font-size:clamp(40px,11vw,64px);line-height:1">${isRecord && score > 0 ? '🏆' : '💀'}</div>
    <div class="final">${score}</div>
    <div class="result-msg">${isRecord && score > 0 ? '¡Nuevo récord!' : 'Récord: ' + best}</div>
    <button id="btn" onclick="start()">Reintentar</button>
    <div id="ov-controls">
      <div class="row"><span class="k">↑</span><span class="k">↓</span><span class="k">←</span><span class="k">→</span><span class="sep">/</span><span class="k">WASD</span><span class="sep">/</span>Deslizar</div>
      <div class="row" style="color:rgba(255,215,0,0.75)"><span class="k gold">Espacio</span><span class="sep">/</span>Mantener <span style="margin-left:2px">⚡ Impulso</span></div>
    </div>
  `;
  OL.style.display = 'flex';
}

function start() {
  OL.style.display = 'none';
  init();
  running = true;
  lastTick = 0;
  raf = requestAnimationFrame(tick);
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!running) start();
    else boostKey = true;
    return;
  }
  const map = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0], w: [0,-1], s: [0,1], a: [-1,0], d: [1,0] };
  if (!running) {
    if (e.key in map) { e.preventDefault(); start(); }
    return;
  }
  if (!(e.key in map)) return;
  e.preventDefault();
  const [nx, ny] = map[e.key];
  if (nx !== 0 && dir.x === 0) next = { x: nx, y: 0 };
  if (ny !== 0 && dir.y === 0) next = { x: 0, y: ny };
});
document.addEventListener('keyup', e => {
  if (e.key === ' ' || e.code === 'Space') boostKey = false;
});

let ts = null, tsMoved = false;
canvas.addEventListener('touchstart', e => {
  ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  tsMoved = false;
  e.preventDefault();
  if (running) {
    touchBoostTimer = setTimeout(() => { if (ts && !tsMoved) touchBoost = true; }, 140);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!ts) return;
  const dx = e.touches[0].clientX - ts.x, dy = e.touches[0].clientY - ts.y;
  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
    tsMoved = true;
    if (touchBoostTimer) { clearTimeout(touchBoostTimer); touchBoostTimer = null; }
    touchBoost = false;
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (touchBoostTimer) { clearTimeout(touchBoostTimer); touchBoostTimer = null; }
  touchBoost = false;
  if (!ts) return;
  if (!running) { start(); ts = null; return; }
  const dx = e.changedTouches[0].clientX - ts.x;
  const dy = e.changedTouches[0].clientY - ts.y;
  ts = null;
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  e.preventDefault();
  if (Math.abs(dx) > Math.abs(dy)) { if (dir.x === 0) next = { x: dx > 0 ? 1 : -1, y: 0 }; }
  else                              { if (dir.y === 0) next = { x: 0, y: dy > 0 ? 1 : -1 }; }
}, { passive: false });

try { best = parseInt(localStorage.getItem('boh_snake') || '0') || 0; } catch { best = 0; }
foodColor = FOOD_COLORS[0];
obstacleCallCount = 0;
bgDraw();
</script>
</body>
</html>
